<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<title>Screensaver</title>
		<meta name="viewport" content="width=device-width,initial-scale=1">
		<style>
            body {
                display: flex;
                justify-content: center;
                align-items: center;
                background-image: url('matrix.gif');
                background-repeat: no-repeat;
                background-size: 100% 100%;
                height: 100vh;
                margin: 0;
            }

            #nana {
                background-image: url('banana.gif');
                background-repeat: no-repeat;
                background-size: 100% 100%;
                width: 40rem;
                height: 40rem;
                opacity: 0;
                transition: opacity 1s ease;
            }

            #nana:hover {
                opacity: 1;
            }
		</style>
	</head>
	<body>
        <div id="nana"></div>
	</body>
</html>

<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>BIGWEBSITE</title><meta name="viewport"content="width=device-width,initial-scale=1"><style>body{display:grid;grid-template-columns:repeat(10, 1fr);grid-template-rows:repeat(7, 1fr);margin:1rem;width:fit-content;}div{display:none;}.i{margin:1rem;}</style></head><body><div><span></span></div><script>const a=async()=>{const r=await fetch("https://picsum.photos/200");const p=document.createElement("img");p.src=r.url;p.alt="";p.classList.add('i');document.body.appendChild(p);return r.url;};for(let i=0;i<700;i++)a();</script></body></html>
